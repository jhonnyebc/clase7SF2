services:
  postgres:
    image: postgres:18-alpine
    container_name: uco-test-api-postgres
    environment:
      POSTGRES_DB: ucotestapi
      POSTGRES_USER: ucotest
      POSTGRES_PASSWORD: ucotest
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
